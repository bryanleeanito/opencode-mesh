# Konfigurasi OpenCode Mesh
# 3 mesin kolaborasi: Tablet, School, Windows

machines:
  kali:
    role: attack
    ip: 192.168.1.100
    ssh_port: 22
    opencode_port: 3000
    kits:
      - waf-bypass
      - cloudflare-bypass
      - sqli-helper
      - payload-generator
      - webshell-manager
      - firewall-bypass
      - ip-changer
      - ip-anti-lock
      - defense-counter
    capabilities:
      - pentest
      - bypass
      - exploit
      - payload
      - scanning

  tablet:
    role: analysis
    ip: 192.168.1.101
    ssh_port: 22
    opencode_port: 3000
    kits:
      - sherlock-osint
      - ctf-decoder
      - ctf-misc-solver
      - code-audit
      - report-packer
    capabilities:
      - osint
      - analysis
      - source_review
      - reporting
      - correlation

  windows:
    role: development
    ip: 192.168.1.102
    ssh_port: 22
    opencode_port: 3000
    kits:
      - windev-specialist
      - security-protect
      - extreme-efficiency
    capabilities:
      - dev
      - devops
      - build
      - deploy
      - automasi

# Task routing rules
routing:
  pentest: kali
  bypass: kali
  exploit: kali
  payload: kali
  scanning: kali
  osint: tablet
  analysis: tablet
  source_review: tablet
  reporting: tablet
  correlation: tablet
  dev: windows
  devops: windows
  build: windows
  deploy: windows
  automasi: windows

# Sync settings
sync:
  interval: 300  # 5 minutes
  auto_pull: true
  auto_push: false

# Security
security:
  encrypt_state: true
  redact_output: true
  audit_log: true
